# Copy this file to  .streamlit/secrets.toml  (note the dot and folder) and fill in your keys.
# On Streamlit Community Cloud, paste the same lines into App settings -> Secrets.
# NEVER commit real keys to GitHub. .streamlit/secrets.toml is already in .gitignore.

# --- AI providers: add at least ONE. A provider appears in the app once its key is set. ---
GROQ_API_KEY   = ""   # free tier   https://console.groq.com
GEMINI_API_KEY = ""   # free tier   https://aistudio.google.com  (Google may use free-tier prompts)
XAI_API_KEY    = ""   # paid        https://console.x.ai
OPENAI_API_KEY = ""   # paid        https://platform.openai.com

# --- Optional: model names (they change often; override here instead of editing code) ---
# MODEL = "openai/gpt-oss-120b"           # Groq main model
# FALLBACK_MODEL = "openai/gpt-oss-20b"   # Groq backup model
# GEMINI_MODEL = "gemini-3.5-flash-lite"
# XAI_MODEL = "grok-4.7"
# OPENAI_MODEL = "gpt-5-mini"

# --- Optional: protect the app / chat saving ---
# APP_PASSWORD = "choose-a-password"
# PERSIST_CHATS = "true"    # save chats to chats.db. ONLY on your own computer or after adding login.
